name: Cloudflare Account Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cf-account-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cc658c266bef011a07f83c73379d47e9
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            printf '%s\n' '{"token_present":false,"api_read_ok":false}' > ops/cf-account-probe.json
          else
            python3 - <<'PY'
          import json,os,urllib.request
          t=os.environ['CLOUDFLARE_API_TOKEN'];a=os.environ['CLOUDFLARE_ACCOUNT_ID'];o={'token_present':True,'api_read_ok':False}
          try:
            q=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{a}/pages/projects?per_page=1',headers={'Authorization':f'Bearer {t}','User-Agent':'KINGAI-Probe/1.0'})
            with urllib.request.urlopen(q,timeout=30) as r:d=json.load(r)
            o['api_read_ok']=d.get('success') is True
          except Exception: pass
          open('ops/cf-account-probe.json','w').write(json.dumps(o,separators=(',',':'))+'\n')
          PY
          fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ops/cf-account-probe.json
          if ! git diff --cached --quiet; then git commit -m 'ops: record Cloudflare access probe [skip ci]'; git push origin HEAD:main; fi
